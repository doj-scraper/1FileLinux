name: Docker Build

# Remote-only build — size is not critical, so we default to the full profile
# which includes all network + disk partitioning capabilities:
# ZFS, Btrfs, recovery, network, crypto, TUI, advanced FS (ntfs-3g/xfsprogs/gptfdisk/exfatprogs/f2fs-tools),
# disk diag (smartmontools/hdparm/nvme-cli/dmidecode/lshw), network diag (ethtool/nmap/wireguard/openvpn),
# system tools, data recovery, boot repair, editors, security.
# Defined in build/86_build_profiles.sh:set_full_profile()

on:
  push:
    branches: [master, main]
    tags:
      - 'build-*'  # build without release
      - 'v*'       # build with release
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build profile — full is recommended (network + partitioning)'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - standard
          - minimal
      compression:
        description: 'EFI compression'
        required: true
        default: 'upx'
        type: choice
        options:
          - upx
          - none
          - xz
          - zstd

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      release: ${{ steps.check-release.outputs.should_release }}
      build_args: ${{ steps.set-matrix.outputs.build_args }}
    steps:
      - id: check-release
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - id: set-matrix
        run: |
          # Default for remote builds: full (size not critical, all tools).
          # Build args are propagated to docker/entrypoint.sh -> build/84_build_core.sh:parse_build_args()
          # and build/86_build_profiles.sh:apply_build_profile() which sets BUILD_TYPE for
          # the EFI filename in build/84_build_core.sh:create_efi() (OneFileLinux-${BUILD_TYPE}.efi).

          # Resolve profile: workflow_dispatch input > tag/push default (full)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PROFILE="${{ github.event.inputs.build_type }}"
            COMP="${{ github.event.inputs.compression }}"
          else
            PROFILE="full"
            COMP="upx"
          fi

          if [ "$COMP" = "none" ]; then
            ARGS="--profile=$PROFILE --without-compression"
          else
            ARGS="--profile=$PROFILE --compression-tool=$COMP"
          fi

          echo "build_args=$ARGS" >> $GITHUB_OUTPUT

          # Single-item matrix keeps artifact naming simple (OneFileLinux-full.efi)
          # For size-not-critical use-case we avoid building all three profiles in parallel
          # (each needs ~10g/2 CPUs — parallel matrix caused OOM on GitHub runners).
          echo "matrix={\"include\":[{\"name\":\"$PROFILE\",\"build_args\":\"$ARGS\"}]}" >> $GITHUB_OUTPUT
          echo "Selected: $ARGS"

  build:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false
    name: Build OneFileLinux (${{ matrix.name }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space (kernel builds need ~25GB)
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h

      - name: Set up build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ make autoconf automake libtool libelf-dev upx-ucl unzip zstd xz-utils ccache uuid-dev libuuid1 libblkid-dev libtirpc-dev
          docker --version
          if ! command -v docker-compose &> /dev/null; then
            if docker compose version &> /dev/null; then
              echo '#!/bin/bash
          docker compose "$@"' > /tmp/docker-compose
              chmod +x /tmp/docker-compose
              sudo mv /tmp/docker-compose /usr/local/bin/docker-compose
            else
              sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.6/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
            fi
          fi
          docker-compose --version
          mkdir -p build/output output
          sudo chown -R $(id -u):$(id -g) build output
          sudo chmod -R 777 build output
          touch build/.build_progress
          chmod 666 build/.build_progress
          chmod -R +x build/*.sh docker/*.sh
          find build/tools -name "*.sh" -exec chmod +x {} \; 2>/dev/null || true

      - name: Cache Alpine kernel configs
        uses: actions/cache@v4
        with:
          path: build/kernel-configs
          key: alpine-kernel-config-${{ hashFiles('build/80_common.sh') }}
          restore-keys: alpine-kernel-config-

      - name: Set up ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('build/84_build_core.sh', 'build/86_build_profiles.sh') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.name }}-
            ccache-${{ runner.os }}-

      - name: Configure build environment
        run: |
          cat > docker/.env << EOF
          # GitHub Actions — remote build, size not critical
          # Generated at $(date -u)
          BUILD_ARGS=${{ matrix.build_args }}
          DOCKER_MEMORY=10g
          DOCKER_CPUS=2
          HOST_UID=$(id -u)
          HOST_GID=$(id -g)
          GITHUB_ACTIONS=true
          RUN_AS_ROOT=true
          RUN_AS_USER=root
          GENERATE_RANDOM_PASSWORD=false
          ROOT_PASSWORD=onefilelinux
          DEBUG_FEATURE_FLAGS=true
          EOF
          cat docker/.env
          mkdir -p build/.onefilelinux
          echo "$(id -u):$(id -g)" > build/.onefilelinux/host_uid_gid
          chmod 666 build/.onefilelinux/host_uid_gid
          mkdir -p ~/.ccache
          sudo chmod -R 777 ~/.ccache
          mkdir -p build/kernel-configs/features
          chmod -R 777 build/kernel-configs 2>/dev/null || true

      - name: Build OneFileLinux using Docker
        env:
          BUILD_ARGS: ${{ matrix.build_args }}
          GENERATE_RANDOM_PASSWORD: "false"
          ROOT_PASSWORD: "onefilelinux"
        run: |
          cd docker
          echo "Building with arguments: $BUILD_ARGS"
          cat .env
          export HOST_UID=$(id -u)
          export HOST_GID=$(id -g)
          if command -v docker-compose &> /dev/null; then
            docker-compose up --build
            EC=$?
          else
            docker compose up --build
            EC=$?
          fi
          if [ $EC -ne 0 ]; then
            echo "Docker build failed: $EC"
            docker compose logs 2>/dev/null || docker-compose logs 2>/dev/null || true
            exit $EC
          fi
          echo "Build output files:"
          ls -lh ../output/ || true
          ls -lh ../build/build_timing.log || true
          cat ../build/build_timing.log 2>/dev/null || true

      - name: Check for build artifacts
        id: check_files
        run: |
          echo "Searching for build artifacts in ./output/"
          ls -la ./output/ || true
          EFI_FILES=$(find ./output/ -name "*.efi" | sort)
          if [ -z "$EFI_FILES" ]; then
            echo "efi_file=false" >> $GITHUB_OUTPUT
            echo "Build failed to produce any EFI file"
            if [ -f ./build/build_timing.log ]; then cat ./build/build_timing.log; fi
            docker compose logs 2>/dev/null || docker-compose logs 2>/dev/null || true
            exit 1
          fi
          echo "efi_file=true" >> $GITHUB_OUTPUT
          PROFILE_EFI="./output/OneFileLinux-${{ matrix.name }}.efi"
          GENERIC_EFI="./output/OneFileLinux.efi"
          # create_efi() in build/84_build_core.sh:398 names file as OneFileLinux-${BUILD_TYPE}.efi
          # and symlinks OneFileLinux.efi -> profile file. Handle both.
          if [ -f "$PROFILE_EFI" ]; then
            PRIMARY_EFI="$PROFILE_EFI"
            echo "efi_path=$PROFILE_EFI" >> $GITHUB_OUTPUT
          elif [ -f "$GENERIC_EFI" ]; then
            PRIMARY_EFI="$GENERIC_EFI"
            echo "efi_path=$GENERIC_EFI" >> $GITHUB_OUTPUT
            cp "$GENERIC_EFI" "$PROFILE_EFI" 2>/dev/null || true
          else
            PRIMARY_EFI=$(echo "$EFI_FILES" | head -1)
            echo "efi_path=$PRIMARY_EFI" >> $GITHUB_OUTPUT
          fi
          du -h "$PRIMARY_EFI"
          echo "All EFI files found:"
          for efi in $EFI_FILES; do du -h "$efi"; done
          if [ -f "./build/build_timing.log" ]; then
            echo "Build Timing Data:"
            cat ./build/build_timing.log
          fi

      - name: Upload build artifact
        if: steps.check_files.outputs.efi_file == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OneFileLinux-${{ matrix.name }}
          path: ./output/*.efi
          if-no-files-found: error

      - name: Upload build timing log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-timing-log-${{ matrix.name }}
          path: ./build/build_timing.log
          if-no-files-found: warn

  release:
    name: Package and Release
    needs: [setup, build]
    if: needs.setup.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create release package
        run: |
          mkdir -p release
          echo "Examining artifact directories:"
          ls -la ./artifacts/
          for artifact_dir in ./artifacts/OneFileLinux-*/; do
            [ -d "$artifact_dir" ] || continue
            echo "Processing $artifact_dir"
            ls -la "$artifact_dir"
            artifact_name=$(basename "$artifact_dir")
            for efi_file in "$artifact_dir"/*.efi; do
              [ -f "$efi_file" ] || continue
              efi_basename=$(basename "$efi_file")
              if [[ "$efi_basename" == *"-"* ]]; then
                cp "$efi_file" "./release/"
                echo "Copied $efi_file -> ./release/$efi_basename"
              else
                profile_name=${artifact_name#OneFileLinux-}
                cp "$efi_file" "./release/OneFileLinux-$profile_name.efi"
                echo "Copied $efi_file -> ./release/OneFileLinux-$profile_name.efi"
              fi
            done
          done
          ls -lh ./release/
          cd release
          zip -r OneFileLinux-release.zip *.efi

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: OneFileLinux-release
          path: ./release/OneFileLinux-release.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./release/OneFileLinux-release.zip
          name: "OneFileLinux ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          generate_release_notes: true
